name: Android APK Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
    - name: Install Android SDK components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
        cat android-app/local.properties
        
    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x android-app/gradlew
      
    - name: Clean project
      run: |
        cd android-app
        ./gradlew clean
        
    - name: Build debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug --stacktrace --info
        
    - name: Build release APK
      run: |
        cd android-app
        ./gradlew assembleRelease --stacktrace --info
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: android-app/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: android-app/app/build/outputs/apk/release/*.apk
        retention-days: 30

  # Rolling pre-release so untagged builds can be downloaded without a
  # GitHub account (Actions artifacts require a login)
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Move nightly tag to current commit
      run: |
        git tag -f nightly
        git push -f origin nightly

    - name: Download APKs
      uses: actions/download-artifact@v4
      with:
        path: ./apk
        merge-multiple: true

    - name: Update nightly pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly build (latest main)
        prerelease: true
        files: ./apk/*.apk
        body: |
          Latest development build from `main` (commit ${{ github.sha }}),
          updated automatically on every push. No GitHub account is needed
          to download. For stable versions use the tagged releases.
        token: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./apk/*.apk
        body: |
          ## 🚀 PDF Sync Viewer Release

          ### 📱 Installation
          1. Download the APK file below
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
          4. Grant Bluetooth and Location permissions

          ### 📋 Usage
          1. Put the same PDF/JPG files on all devices and select the folder in the app
          2. Server device: tap "Server" - file and page changes are broadcast via BLE
          3. Client devices: tap "Client" - they follow the server automatically
          4. Optional: control the server via RTP MIDI (session "pdf-sync-viewer",
             bank/program select the file named bank_program.pdf)

          ### 🔧 Requirements
          - Android 5.0+ (API 21+)
          - Bluetooth LE support
          - Same Wi-Fi network for RTP MIDI control
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
